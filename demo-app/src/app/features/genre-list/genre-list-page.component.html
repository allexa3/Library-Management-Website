<!-- SEO: semantic structure -->
<div class="page-workspace page-enter">

  <!-- Page hero -->
  <section class="page-hero" aria-labelledby="genres-heading">
    <div class="hero-text">
      <h1 id="genres-heading" class="page-title">Genres</h1>
      <p class="page-subtitle">Manage book categories — create, rename, and remove genre tags.</p>
    </div>
    <div class="hero-actions">
      <button
        class="btn-primary"
        (click)="openCreateDialog()"
        [disabled]="isLoading()"
        type="button"
        aria-label="Add a new genre"
        aria-haspopup="dialog">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add genre
      </button>
      <button
        class="btn-secondary logout-btn"
        (click)="logout()"
        type="button"
        aria-label="Sign out">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sign out
      </button>
    </div>
  </section>

  <!-- Loading -->
  <div *ngIf="isLoading()" class="state-loading" role="status" aria-live="polite" aria-busy="true">
    <div class="spinner" aria-hidden="true"></div>
    <p class="state-loading-text">Loading genres…</p>
  </div>

  <!-- Genres grid -->
  <section
    *ngIf="!isLoading()"
    class="genres-grid"
    aria-label="Book genres"
    aria-live="polite">

    <!-- Genre card -->
    <article
      *ngFor="let genre of genres()"
      class="genre-card"
      [attr.aria-label]="genre.name + ' genre'">

      <!-- Card content -->
      <div class="genre-card-body">
        <div class="genre-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
            <line x1="7" y1="7" x2="7.01" y2="7"/>
          </svg>
        </div>
        <h2 class="genre-name">{{ genre.name }}</h2>
      </div>

      <!-- Card footer -->
      <footer class="genre-card-footer">
        <button
          class="btn-ghost btn-sm"
          (click)="editGenre(genre)"
          [disabled]="isLoading()"
          type="button"
          [attr.aria-label]="'Edit genre: ' + genre.name">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Edit
        </button>
        <button
          class="btn-danger btn-sm"
          (click)="deleteGenre(genre)"
          [disabled]="isLoading()"
          type="button"
          [attr.aria-label]="'Delete genre: ' + genre.name">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          Delete
        </button>
      </footer>
    </article>

    <!-- Empty state -->
    <div *ngIf="genres().length === 0" class="state-empty" role="status">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" class="empty-icon" aria-hidden="true">
        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
        <line x1="7" y1="7" x2="7.01" y2="7"/>
      </svg>
      <p class="empty-title">No genres yet</p>
      <p class="empty-text">Create your first genre to start organizing books.</p>
    </div>
  </section>

  <p *ngIf="!isLoading() && genres().length > 0" class="results-count" aria-live="polite">
    {{ genres().length }} {{ genres().length === 1 ? 'genre' : 'genres' }}
  </p>
</div>
