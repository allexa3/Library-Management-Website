<!-- SEO: Primary page structure with semantic landmarks -->
<div class="app-shell" [class.auth-layout]="isAuthPage">

  <!-- NAVIGATION — hidden on login/forgot-password -->
  <header
    *ngIf="!isAuthPage"
    class="app-nav"
    role="banner"
    aria-label="LibFlow site navigation">

    <div class="nav-inner">
      <!-- Brand -->
      <a routerLink="/books" class="nav-brand" aria-label="LibFlow — go to books">
        <span class="brand-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="3" y="4" width="15" height="20" rx="2" fill="currentColor" opacity="0.15"/>
            <rect x="3" y="4" width="15" height="20" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <rect x="10" y="6" width="15" height="20" rx="2" fill="currentColor" opacity="0.08"/>
            <rect x="10" y="6" width="15" height="20" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <line x1="6" y1="11" x2="13" y2="11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="6" y1="14" x2="13" y2="14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="6" y1="17" x2="10" y2="17" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-name">LibFlow</span>
      </a>

      <!-- Primary nav links (only when authenticated) -->
      <nav
        *ngIf="isAuthenticated()"
        class="nav-links"
        role="navigation"
        aria-label="Main navigation">
        <a
          routerLink="/books"
          routerLinkActive="nav-link--active"
          class="nav-link"
          aria-current="page">
          Books
        </a>
        <a
          *ngIf="isAdmin()"
          routerLink="/people"
          routerLinkActive="nav-link--active"
          class="nav-link">
          People
        </a>
        <a
          *ngIf="isAdmin()"
          routerLink="/genres"
          routerLinkActive="nav-link--active"
          class="nav-link">
          Genres
        </a>
      </nav>

      <!-- Right controls -->
      <div class="nav-controls">
        <!-- Theme toggle -->
        <button
          (click)="toggleTheme()"
          class="nav-icon-btn theme-btn"
          [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
          [attr.aria-pressed]="isDarkMode"
          type="button">
          <svg *ngIf="!isDarkMode" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg *ngIf="isDarkMode" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>

        <!-- Hamburger menu button (mobile only) -->
        <button
          (click)="toggleMobileMenu()"
          class="nav-icon-btn hamburger-btn"
          [attr.aria-label]="isMobileMenuOpen ? 'Close menu' : 'Open menu'"
          [attr.aria-expanded]="isMobileMenuOpen"
          type="button">
          <svg *ngIf="!isMobileMenuOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
          <svg *ngIf="isMobileMenuOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile menu panel -->
    <div class="mobile-menu" [class.mobile-menu--open]="isMobileMenuOpen" role="dialog" aria-label="Mobile navigation">
      <nav class="mobile-nav" aria-label="Mobile menu navigation">
        <a
          routerLink="/books"
          routerLinkActive="mobile-nav-link--active"
          class="mobile-nav-link"
          (click)="closeMobileMenu()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          Books
        </a>
        <a
          *ngIf="isAdmin()"
          routerLink="/people"
          routerLinkActive="mobile-nav-link--active"
          class="mobile-nav-link"
          (click)="closeMobileMenu()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          People
        </a>
        <a
          *ngIf="isAdmin()"
          routerLink="/genres"
          routerLinkActive="mobile-nav-link--active"
          class="mobile-nav-link"
          (click)="closeMobileMenu()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          Genres
        </a>

        <div class="mobile-menu-divider"></div>

        <a
          *ngIf="!isAuthenticated()"
          routerLink="/login"
          class="mobile-nav-link mobile-nav-link--login"
          (click)="closeMobileMenu()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Log in
        </a>
        <button
          *ngIf="isAuthenticated()"
          (click)="logout()"
          class="mobile-nav-link mobile-nav-link--logout"
          type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign out
        </button>
      </nav>
    </div>
  </header>

  <!-- Auth pages: brand + theme toggle only -->
  <header
    *ngIf="isAuthPage"
    class="auth-header"
    role="banner">
    <div class="auth-header-inner">
      <a routerLink="/login" class="nav-brand" aria-label="LibFlow">
        <span class="brand-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="3" y="4" width="15" height="20" rx="2" fill="currentColor" opacity="0.15"/>
            <rect x="3" y="4" width="15" height="20" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <rect x="10" y="6" width="15" height="20" rx="2" fill="currentColor" opacity="0.08"/>
            <rect x="10" y="6" width="15" height="20" rx="2" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </span>
        <span class="brand-name">LibFlow</span>
      </a>
      <button
        (click)="toggleTheme()"
        class="nav-icon-btn theme-btn"
        [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
        [attr.aria-pressed]="isDarkMode"
        type="button">
        <svg *ngIf="!isDarkMode" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg *ngIf="isDarkMode" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main content -->
  <main
    id="main-content"
    class="app-main"
    role="main"
    tabindex="-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer *ngIf="!isAuthPage" class="app-footer" role="contentinfo">
    <div class="footer-inner">
      <p>
        <span class="footer-brand">LibFlow</span>
        &copy; 2026 — Library management, beautifully simple.
      </p>
    </div>
  </footer>
</div>
